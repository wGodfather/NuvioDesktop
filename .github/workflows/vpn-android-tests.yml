name: Nuvio VPN Android and TV validation

on:
  workflow_dispatch:
  push:
    branches: ['codex/optional-wireguard-vpn']
    paths:
      - 'composeApp/src/androidMain/**'
      - 'composeApp/src/androidHostTest/**/vpn/**'
      - 'composeApp/src/commonMain/**/vpn/**'
      - 'androidApp/**'
      - 'composeApp/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'tools/vpn-peer/**'
      - 'tools/qa_torrent_seed.py'
      - '.github/workflows/vpn-android-tests.yml'

permissions:
  contents: read

jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 35
            target: default
            arch: x86_64
          - device: android-tv
            api: 34
            target: android-tv
            arch: x86
          - device: google-tv
            api: 34
            target: google-tv
            arch: x86
          - device: google-tv-16k
            api: 36
            target: google-tv-ps16k
            arch: x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/vpn-peer/go.sum
      - name: Verify and start ephemeral encrypted peer
        run: |
          go -C tools/vpn-peer test -v .
          go -C tools/vpn-peer build -o ../../vpn-peer .
          mkdir -p vpn-emulator-report
          NUVIO_QA_ADVERTISE_IP=10.90.0.1 NUVIO_QA_FIXTURE_OUTPUT=vpn-emulator-report/fixture.json python tools/qa_torrent_seed.py > vpn-emulator-report/seed.log 2>&1 &
          for attempt in $(seq 1 50); do test -f vpn-emulator-report/fixture.json && break; sleep 0.2; done
          ./vpn-peer -fixture vpn-emulator-report/fixture.json > vpn-emulator-report/peer.log 2>&1 &
          for attempt in $(seq 1 50); do curl --silent --fail http://127.0.0.1:8765/ready && break; sleep 0.2; done
      - name: Prepare disposable emulator
        run: |
          touch local.properties
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile and run VPN policy, parser and shutdown tests
        if: matrix.device == 'phone'
        run: |
          ./gradlew :composeApp:testAndroidHostTest '--tests=com.nuvio.app.features.vpn.*' --tests '*AndroidTorrentDownloadTest*' --tests '*AndroidDownloadTransferTest*' --tests '*P2pStreamingEngineAndroidTest*' -Pkotlin.compiler.execution.strategy=in-process --max-workers=1 --no-daemon --no-configuration-cache
      - name: Real JNI TUN and remote profile flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: 1536M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :androidApp:connectedFullDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.nuvio.android.VpnAndroidIntegrationTest,com.nuvio.android.VpnPeerIntegrationTest' -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pkotlin.compiler.execution.strategy=in-process --max-workers=1 --no-daemon --no-configuration-cache
      - name: Preserve results and screenshots
        if: always()
        run: |
          mkdir -p vpn-emulator-report
          adb pull /sdcard/Android/data/com.wgodfather.nuvio.debug/files/vpn-qa vpn-emulator-report/ || true
          adb shell getprop ro.build.fingerprint > vpn-emulator-report/fingerprint.txt || true
          curl --silent --fail http://127.0.0.1:8765/metrics > vpn-emulator-report/peer-metrics.json || true
          # Avoid logcat/bugreport: native protocol logs can contain endpoint details.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-${{ matrix.device }}-${{ github.sha }}
          path: |
            composeApp/build/test-results/testAndroidHostTest
            androidApp/build/reports/androidTests
            androidApp/build/outputs/androidTest-results
            vpn-emulator-report
