name: Nuvio Türkiye Windows

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Windows kurulum dosyasını taslak sürüme ekle
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: turkiye-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      GH_TOKEN: ${{ github.token }}
      NUVIO_SIGN_CERT_PASSWORD: ${{ secrets.NUVIO_WINDOWS_SIGN_CERT_PASSWORD }}
      NUVIO_SIGN_CERT_THUMBPRINT: ${{ secrets.NUVIO_WINDOWS_SIGN_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Windows bileşenlerini getir ve doğrula
        shell: pwsh
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe,composeApp/src/desktopMain/resources/verification/windows/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { throw "Git LFS bileşenleri indirilemedi" }
          $probe = "composeApp/src/desktopMain/resources/verification/windows/ffprobe.exe"
          $expected = (Get-Content "$probe.sha256" -Raw).Trim()
          if ((Get-FileHash $probe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "Video denetleyicisi sağlama değeri eşleşmiyor"
          }
          $version = (Select-String -Path "composeApp/Configuration/DesktopVersion.properties" -Pattern '^VERSION_NAME=').Line.Split('=',2)[1].Trim()
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/vpn-peer/go.sum
      - name: Build loopback-only season pack fixture bridge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Push-Location tools/vpn-peer
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw 'Fixture transport tests failed' }
            go build -o ../../build/torrent-pack-peer.exe .
            if ($LASTEXITCODE -ne 0) { throw 'Fixture transport compilation failed' }
          } finally { Pop-Location }
      - name: Optional trusted Windows signing identity
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.NUVIO_WINDOWS_SIGN_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP 'nuvio-sign.pfx'
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
            "NUVIO_SIGN_CERT_FILE=$certPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: İsteğe bağlı hizmet ayarları
        shell: pwsh
        run: |
          if ($env:LOCAL_PROPERTIES_BASE64) {
            [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/local.properties", [Convert]::FromBase64String($env:LOCAL_PROPERTIES_BASE64))
          } else {
            New-Item -ItemType File -Path local.properties -Force | Out-Null
            Write-Output "Yerel/misafir kullanım için derleniyor; hesap senkronizasyonu ayarlanmamış."
          }
      - name: WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP/nuget" -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw "WebView2 SDK kurulamadı" }
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP/nuget/Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Düzeltme testleri ve Windows MSI
        shell: pwsh
        run: |
          $env:JAVA_TOOL_OPTIONS="-Djdk.net.unixdomain.tmpdir=$env:RUNNER_TEMP"
          $env:APPDATA="$env:RUNNER_TEMP/nuvio-tests/roaming"
          $env:LOCALAPPDATA="$env:RUNNER_TEMP/nuvio-tests/local"
          .\gradlew.bat :composeApp:desktopTest --tests '*TmdbCatalogTransportTest*' --tests '*SearchCatalogIntegrationTest*' --tests '*CatalogPaginationStateTest*' --tests '*SearchRequestStateTest*' --tests '*StreamSourceVerificationTest*' --tests '*DesktopStreamSourceVerifierTest*' --tests '*DesktopHlsDownloadTest*' --tests '*StreamParserTest*' --tests '*PluginRuntimeDesktopTest*' --tests '*StreamListingPolicyTest*' --tests '*StreamsContextMenuTest*' '--tests=com.nuvio.app.features.vpn.*' --tests '*P2pMagnetTest*' --tests '*TorrentFileSelectionTest*' --tests '*TorrentDownloadPartialTest*' --tests '*DesktopTorrentEpisodePackTest*' :composeApp:packageMsi "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" "-Pcompose.desktop.packaging.checkJdkVendor=false" "-Pkotlin.compiler.execution.strategy=in-process" --max-workers=1 --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Test veya paketleme başarısız" }
          $msi="composeApp/build/compose/release-msis/Nuvio-Windows-x64-$env:RELEASE_VERSION.msi"
          if (-not (Test-Path $msi)) { throw "Windows kurulum dosyası bulunamadı" }
          (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$msi.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Windows-${{ env.RELEASE_VERSION }}
          path: composeApp/build/compose/release-msis/*
          if-no-files-found: error
      - name: Upgrade, repair, rollback and uninstall on disposable Windows
        shell: pwsh
        run: ./.github/scripts/test-vpn-msi.ps1 -Msi "composeApp/build/compose/release-msis/Nuvio-Windows-x64-$env:RELEASE_VERSION.msi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nuvio-Windows-MSI-QA-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vpn-msi-lifecycle/*.log
            composeApp/build/test-results/desktopTest
            build/torrent-pack-qa
      - name: Taslak sürüm
        if: inputs.create_draft
        shell: pwsh
        run: |
          $msi="composeApp/build/compose/release-msis/Nuvio-Windows-x64-$env:RELEASE_VERSION.msi"
          $isDraft = gh release view "$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne 'true') { throw "Yayımlanmış bir sürümün dosyaları değiştirilmez." }
            gh release upload "$env:RELEASE_VERSION" $msi "$msi.sha256" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:RELEASE_VERSION" $msi "$msi.sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --draft --prerelease --title "Nuvio Türkiye $env:RELEASE_VERSION" --notes-file RELEASE_NOTES_TR.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Taslak sürüm oluşturulamadı" }
