name: Nuvio VPN Windows isolation tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'composeApp/src/**/features/vpn/**'
      - 'composeApp/src/desktopMain/native/vpn/**'
      - '.github/scripts/build-vpn-runtime.ps1'
      - '.github/scripts/test-vpn-demo.ps1'
      - '.github/scripts/test-vpn-peer.ps1'
      - 'tools/vpn-peer/**'
      - '.github/workflows/vpn-windows-tests.yml'

permissions:
  contents: read

jobs:
  native-isolation:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the exact packaged native torrent motor
        shell: pwsh
        run: |
          git lfs pull --include='composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Native torrent LFS retrieval failed.' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/vpn-peer/go.sum
      - name: Compile helper, validate profiles and encrypted storage
        shell: pwsh
        run: ./.github/scripts/build-vpn-runtime.ps1
      - name: Check persistent firewall and recovery on this disposable runner
        shell: pwsh
        run: |
          try {
            & ./composeApp/build/native/vpn/NuvioVpn.exe firewall-smoke-test
            if ($LASTEXITCODE -ne 0) { throw 'Isolated WFP checks failed.' }
          } finally {
            & ./composeApp/build/native/vpn/NuvioVpn.exe recover
          }
      - name: Check controlled encrypted peer, IPv4, IPv6, DNS and broker lifecycle
        shell: pwsh
        run: ./.github/scripts/test-vpn-peer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-windows-peer-${{ github.sha }}
          path: build/vpn-peer-qa
      - name: Restore access if any preceding check failed
        if: always()
        shell: pwsh
        run: |
          $helper = './composeApp/build/native/vpn/NuvioVpn.exe'
          if (Test-Path -LiteralPath $helper) {
            & $helper recover
            if ($LASTEXITCODE -ne 0) { throw 'VPN firewall recovery failed.' }
          }
